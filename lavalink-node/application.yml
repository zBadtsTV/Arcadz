server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "change-this-in-render-environment"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
logging:
  level:
    root: INFO
